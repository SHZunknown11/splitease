    <clipPath id="upper"><polygon points="0,0 64,0 0,64"/></clipPath>
    <clipPath id="lower"><polygon points="64,0 64,64 0,64"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#1c2a6b"/>
